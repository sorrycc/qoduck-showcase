<style>

    --shallow:#1d7f86;
    --foam:#eaf7f4;
    --sun:#ffd79a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}

    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  }

    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #pool{
    position:fixed;inset:0;width:100%;height:100%;display:block;
    opacity:0;transition:opacity 1.6s ease-out;
    background:
      radial-gradient(120% 90% at 50% 8%, #14525c 0%, #0a2c37 45%, #04161e 100%);
  }
  #pool.live{opacity:1;}
  /* vignette + warm sun bloom, purely atmospheric, never interactive */
  #atmos{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(78% 62% at 22% 12%, rgba(255,214,150,.16), rgba(255,214,150,0) 62%),
      radial-gradient(120% 100% at 50% 52%, rgba(0,0,0,0) 42%, rgba(2,16,22,.55) 100%);

  }
  #atmos.live{opacity:1;}
  #grain{
    position:fixed;inset:-50%;pointer-events:none;opacity:0;
    transition:opacity 2.4s ease-out .5s;
    background-repeat:repeat;background-size:180px 180px;
    mix-blend-mode:overlay;
  }
  #grain.live{opacity:.16;}
  @media (prefers-reduced-motion: reduce){
    #pool,#atmos,#grain{transition-duration:.4s;}
  }

<script type="module">
import * as THREE from 'three';

const CFG = {
  world: 40,            // terrain / water plane extent
  hmRes: 512,           // heightmap resolution over the world
  gridSeg: 200,         // terrain tessellation
  waterY: 0.0,
  simRes: 256,
  simSpan: 11.0,        // ripple domain, centred on the pool
  sunDir: new THREE.Vector3(-0.42, 0.60, -0.68).normalize(),
  sunColor: new THREE.Color('#ffe6bb'),
  skyTop: new THREE.Color('#2f7fb5'),
  skyHorizon: new THREE.Color('#cfe4ea'),
  waterTint: new THREE.Color('#1a8f96'),
  waterDeep: new THREE.Color('#06333f'),
};
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const SMALL = Math.min(innerWidth, innerHeight) < 620;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

function hash2(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return n - Math.floor(n); }
function hash3(x, y, z) { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123; return n - Math.floor(n); }
function vnoise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);

}
function vnoise3(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const c000 = hash3(ix, iy, iz), c100 = hash3(ix + 1, iy, iz), c010 = hash3(ix, iy + 1, iz), c110 = hash3(ix + 1, iy + 1, iz);
  const c001 = hash3(ix, iy, iz + 1), c101 = hash3(ix + 1, iy, iz + 1), c011 = hash3(ix, iy + 1, iz + 1), c111 = hash3(ix + 1, iy + 1, iz + 1);
  return lerp(lerp(lerp(c000, c100, ux), lerp(c010, c110, ux), uy), lerp(lerp(c001, c101, ux), lerp(c011, c111, ux), uy), uz);
}
function fbm2(x, y, oct = 4) {
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise2(x * f, y * f); norm += a; a *= 0.5; f *= 2.03; }
  return s / norm;
}
function fbm3(x, y, z, oct = 4) {
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2.07; }

}
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

// organic pool outline + seabed. One source of truth for mesh, heightmap and ripple mask.
function poolRadius(a) {
  return 3.0 + 0.34 * Math.sin(3 * a + 0.7) + 0.22 * Math.sin(5 * a - 1.1) + 0.12 * Math.sin(8 * a + 2.0);
}
const INLET_ANG = -Math.PI / 2;
function terrainH(x, z) {
  const r = Math.hypot(x, z), a = Math.atan2(z, x);
  const d = r - poolRadius(a);
  const n1 = fbm2(x * 0.33 + 4.1, z * 0.33 - 2.7, 4);
  const n2 = fbm2(x * 1.25 - 9.0, z * 1.25 + 5.0, 3);
  const inlet = Math.exp(-Math.pow(angDiff(a, INLET_ANG) / 0.46, 2));
  let floor = -0.66 + 0.26 * (n1 - 0.5) + 0.09 * (n2 - 0.5);
  floor -= 0.20 * inlet * smoothstep(-3.2, 0.4, d);
  let rim = 0.24 + 0.66 * n1 + 0.24 * n2 + 0.34 * smoothstep(0.3, 3.4, d);
  rim = rim * (1 - 0.95 * inlet) - 0.16 * inlet;
  const t = smoothstep(-0.9, 0.14, d);
  let h = floor * (1 - t) + rim * t;
  const sea = smoothstep(-4.0, -7.2, z);

const depthAt = (x, z) => CFG.waterY - terrainH(x, z);

// boulders: {x,z,r,rot,seed,submerged}
const BOULDERS = [];
{
  let s = 1337;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * TAU + rnd() * 0.2;
    if (Math.abs(angDiff(a, INLET_ANG)) < 0.42) continue;
    const pr = poolRadius(a);
    const rad = pr + 0.15 + rnd() * 1.5;
    const r = 0.42 + rnd() * 0.72;
    BOULDERS.push({ x: Math.cos(a) * rad, z: Math.sin(a) * rad, r, rot: rnd() * TAU, seed: rnd() * 40, submerged: false });
  }
  // a handful of stones drowning inside the pool: ripple obstacles + caustic catchers
  const inner = [[-1.55, 0.95, 0.62], [1.35, -1.15, 0.5], [0.35, 1.85, 0.4], [-0.9, -1.9, 0.34], [2.1, 0.7, 0.45]];
  for (const [x, z, r] of inner) {
    BOULDERS.push({ x, z, r, rot: hash2(x, z) * TAU, seed: hash2(z, x) * 40, submerged: terrainH(x, z) + r * 0.62 > -0.05 });
  }
}
// ---- procedural textures -------------------------------------------------
const HM_RANGE = [-4.5, 2.5];
function buildHeightmap() {
  const n = CFG.hmRes, data = new Uint16Array(n * n);
  const half = CFG.world / 2;
  for (let j = 0; j < n; j++) {
    const z = (j / (n - 1)) * CFG.world - half;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * CFG.world - half;
      data[j * n + i] = THREE.DataUtils.toHalfFloat(terrainH(x, z));
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RedFormat, THREE.HalfFloatType);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  return t;
}
function buildMask() {
  const n = CFG.simRes, data = new Uint8Array(n * n * 4), half = CFG.simSpan / 2;
  for (let j = 0; j < n; j++) {
    const z = (j / (n - 1)) * CFG.simSpan - half;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * CFG.simSpan - half;
      // dry rock reflects ripples; a submerged stone only slows them
      let h = terrainH(x, z);
      for (const b of BOULDERS) {
        const d = Math.hypot(x - b.x, z - b.z);
        if (d < b.r * 0.92) {
          const top = boulderY(b) + Math.sqrt(Math.max(0, b.r * b.r * 0.85 - d * d)) * 0.74;
          if (top > h) h = top;
        }
      }
      const v = h > -0.015 ? 255 : (h > -0.16 ? 90 : 0);
      const k = (j * n + i) * 4;
      data[k] = data[k + 1] = data[k + 2] = v; data[k + 3] = 255;
    }
  }
  const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  return t;
}
function buildNoiseTexture() {
  const n = 256;
  const per = [5, 10, 20], amp = [0.55, 0.30, 0.15];
  const pn = (x, y, p) => {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const w = (i, j) => hash2(((i % p) + p) % p + 0.5, ((j % p) + p) % p + 0.5);
    return lerp(lerp(w(ix, iy), w(ix + 1, iy), ux), lerp(w(ix, iy + 1), w(ix + 1, iy + 1), ux), uy);
  };
  const f = new Float32Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    let s = 0;
    for (let o = 0; o < per.length; o++) s += amp[o] * pn(i / n * per[o], j / n * per[o], per[o]);
    f[j * n + i] = s;
  }
  const data = new Uint8Array(n * n * 4);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const gx = (f[j * n + ((i + 1) % n)] - f[j * n + ((i - 1 + n) % n)]) * n * 0.30;
    const gy = (f[((j + 1) % n) * n + i] - f[((j - 1 + n) % n) * n + i]) * n * 0.30;
    const k = (j * n + i) * 4;
    data[k] = clamp(gx * 0.5 + 0.5, 0, 1) * 255;
    data[k + 1] = clamp(gy * 0.5 + 0.5, 0, 1) * 255;
    data[k + 2] = clamp(f[j * n + i], 0, 1) * 255;
    data[k + 3] = 255;

const heightTex = buildHeightmap();
const maskTex = buildMask();
const noiseTex = buildNoiseTexture();
{
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d'), img = g.createImageData(180, 180);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 110 + Math.random() * 90;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 26;
  }
  g.putImageData(img, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
}
// ---- shared water field (surface, refraction and caustics all read this) ---
const U = {
  uTime: { value: 0 },
  uWater: { value: CFG.waterY },
  uSurge: { value: 0 },
  uSurgeZ: { value: -9 },
  uTurbidity: { value: 0 },
  uWorldSize: { value: CFG.world },
  uSimMin: { value: new THREE.Vector2(-CFG.simSpan / 2, -CFG.simSpan / 2) },
  uSimSize: { value: new THREE.Vector2(CFG.simSpan, CFG.simSpan) },
  uSimTexel: { value: new THREE.Vector2(1 / CFG.simRes, 1 / CFG.simRes) },
  uRipple: { value: null },
  uHeight: { value: heightTex },
  uNoise: { value: noiseTex },
  uSunDir: { value: CFG.sunDir },
  uRefract: { value: null },
  uSkyTop: { value: CFG.skyTop },
  uSkyHorizon: { value: CFG.skyHorizon },
  uWaterTint: { value: CFG.waterTint },
  uWaterDeep: { value: CFG.waterDeep },
  uCamPos: { value: new THREE.Vector3() },
  uAgit: { value: 0 },
};

const FIELD_GLSL = /* glsl */`
uniform float uTime, uWater, uSurge, uSurgeZ, uTurbidity, uWorldSize;
uniform sampler2D uRipple, uHeight, uNoise;
uniform vec2 uSimMin, uSimSize, uSimTexel;
uniform vec3 uSunDir;

float terrainH(vec2 p){ return texture2D(uHeight, p / uWorldSize + 0.5).r; }
float depthOf(vec2 p){ return uWater - terrainH(p); }

float rippleH(vec2 p){
  vec2 uv = (p - uSimMin) / uSimSize;
  vec2 e = smoothstep(vec2(0.0), vec2(0.05), uv) * (1.0 - smoothstep(vec2(0.95), vec2(1.0), uv));
  return texture2D(uRipple, clamp(uv, 0.002, 0.998)).r * e.x * e.y;
}
vec2 rippleGrad(vec2 p){
  vec2 uv = (p - uSimMin) / uSimSize;
  float l = texture2D(uRipple, uv - vec2(uSimTexel.x, 0.0)).r;
  float r = texture2D(uRipple, uv + vec2(uSimTexel.x, 0.0)).r;
  float d = texture2D(uRipple, uv - vec2(0.0, uSimTexel.y)).r;
  float u = texture2D(uRipple, uv + vec2(0.0, uSimTexel.y)).r;
  vec2 g = vec2(r - l, u - d) / (2.0 * uSimTexel * uSimSize);
  vec2 e = smoothstep(vec2(0.0), vec2(0.05), uv) * (1.0 - smoothstep(vec2(0.95), vec2(1.0), uv));
  return g * e.x * e.y;
}
float rippleCurv(vec2 p){
  vec2 uv = (p - uSimMin) / uSimSize;
  float c = texture2D(uRipple, uv).r;
  float l = texture2D(uRipple, uv - vec2(uSimTexel.x, 0.0)).r;
  float r = texture2D(uRipple, uv + vec2(uSimTexel.x, 0.0)).r;
  float d = texture2D(uRipple, uv - vec2(0.0, uSimTexel.y)).r;
  float u = texture2D(uRipple, uv + vec2(0.0, uSimTexel.y)).r;
  vec2 e = smoothstep(vec2(0.0), vec2(0.05), uv) * (1.0 - smoothstep(vec2(0.95), vec2(1.0), uv));
  return (l + r + d + u - 4.0 * c) * 18.0 * e.x * e.y;
}

// long swell: x = height, yz = slope. Shallow water flattens it, open sea builds it up.
vec3 swell(vec2 p, float t){
  float amp = mix(0.62, 2.1, smoothstep(0.45, 2.6, depthOf(p))) * (1.0 + uSurge * 0.85);
  float wob = (texture2D(uNoise, p * 0.13).b - 0.5) * 2.6;
  vec3 s = vec3(0.0);
  vec2 d; float ph;
  d = vec2(0.50, 0.86);  ph = dot(p, d) * 1.45 + t * 1.05 + wob;
  s += vec3(sin(ph), d * 1.45 * cos(ph)) * 0.021;
  d = vec2(-0.88, 0.47); ph = dot(p, d) * 2.35 - t * 1.42 - wob * 0.7;
  s += vec3(sin(ph), d * 2.35 * cos(ph)) * 0.013;
  d = vec2(0.24, -0.97); ph = dot(p, d) * 3.90 + t * 1.95 + wob * 1.3;
  s += vec3(sin(ph), d * 3.90 * cos(ph)) * 0.0075;
  d = vec2(0.97, 0.26);  ph = dot(p, d) * 6.10 - t * 2.60 - wob * 1.7;
  s += vec3(sin(ph), d * 6.10 * cos(ph)) * 0.0038;

  float front = exp(-pow((p.y - uSurgeZ) / 0.85, 2.0));
  s += vec3(front * 0.075 * uSurge, 0.0, -front * 0.075 * uSurge * 1.6 * (p.y - uSurgeZ) / 0.72);

}
vec2 windSlope(vec2 p, float t){
  vec2 a = texture2D(uNoise, p * 0.42 + vec2(t * 0.030, t * 0.019)).rg * 2.0 - 1.0;
  vec2 b = texture2D(uNoise, p * 1.05 - vec2(t * 0.047, t * 0.033)).rg * 2.0 - 1.0;
  vec2 c = texture2D(uNoise, p * 1.70 + vec2(-t * 0.081, t * 0.062)).rg * 2.0 - 1.0;
  float amp = (0.11 + 0.075 * uSurge) * mix(1.0, 0.45, smoothstep(0.5, 2.4, depthOf(p)));

float causticCell(vec2 p, float t){

  p = mod(p, vec2(40.0)) - 250.0;

    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));

vec3 caustics(vec3 wpos, vec3 wnormal){

// skyColor needs these two as well
const SKY_UNI = /* glsl */`uniform vec3 uSkyTop, uSkyHorizon;`;
const FIELD = SKY_UNI + FIELD_GLSL;

const VERT_HEAD = /* glsl */`
varying vec3 vWPos; varying vec3 vWNormal;
uniform float uAgit, uTime, uWater, uSurge, uSurgeZ, uTurbidity;
`;
const FRAG_HEAD = FIELD + /* glsl */`
varying vec3 vWPos; varying vec3 vWNormal;
`;
const WORLD_POS = /* glsl */`
  vec4 wp4 = vec4(transformed, 1.0);
  vec3 onrm = objectNormal;
  #ifdef USE_INSTANCING
    wp4 = instanceMatrix * wp4;
    onrm = mat3(instanceMatrix) * onrm;
  #endif
  vWPos = (modelMatrix * wp4).xyz;
  vWNormal = normalize(mat3(modelMatrix) * onrm);
`;
const CAUSTIC_ADD = /* glsl */`
  gl_FragColor.rgb += caustics(vWPos, vWNormal) * 1.15;
`;

// Injects the shared water field into any lit material.
function wet(mat, opts = {}) {
  mat.onBeforeCompile = (shader) => {
    for (const k in U) shader.uniforms[k] = U[k];
    shader.vertexShader = VERT_HEAD + shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n' + (opts.vertex || '') + WORLD_POS

      let maxDart = 0;
      for (const f of fishes) {
        if (t > f.pickAt) pick(f, t);
        tmp.subVectors(f.tgt, f.p).setY(0);
        if (tmp.length() < 0.25) pick(f, t);
        tmp.normalize().multiplyScalar(0.34);
        for (const o of fishes) {
          if (o === f) continue;
          const d = f.p.distanceTo(o.p);
          if (d < 0.34 && d > 1e-4) tmp.addScaledVector(away.subVectors(f.p, o.p).normalize(), (0.34 - d) * 1.6);
        }
        const nx = f.p.x + f.v.x * 0.35, nz = f.p.z + f.v.z * 0.35;
        if (terrainH(nx, nz) > -0.24) tmp.addScaledVector(away.set(-f.p.x, 0, -f.p.z).normalize(), 0.9);
        for (const b of BOULDERS) {
          const dx = f.p.x - b.x, dz = f.p.z - b.z, dd = Math.hypot(dx, dz);
          if (dd < b.r * 1.2 && dd > 1e-4) tmp.addScaledVector(away.set(dx / dd, 0, dz / dd), (b.r * 1.2 - dd) * 2.2);
        }
        f.dart = Math.max(0, f.dart - dt * 0.85);
        maxDart = Math.max(maxDart, f.dart);
        f.dv.multiplyScalar(Math.pow(0.06, dt));
        tmp.add(f.dv);
        const vmax = 0.42 + f.dart * 2.4;
        if (tmp.length() > vmax) tmp.setLength(vmax);
        f.v.lerp(tmp, clamp(dt * (3.2 + f.dart * 6), 0, 1));
        f.p.addScaledVector(f.v, dt);
        const floor = terrainH(f.p.x, f.p.z);
        const wantY = Math.min(floor + 0.16 + Math.sin(t * 1.3 + f.ph) * 0.045 + f.dart * 0.05, -0.10);
        f.p.y += (wantY - f.p.y) * clamp(dt * 4, 0, 1);
        f.m.position.copy(f.p);
        if (f.v.lengthSq() > 1e-6) {
          away.copy(f.p).add(f.v);
          f.m.lookAt(away);
          f.m.rotateZ(clamp(-f.v.x * 0.12, -0.4, 0.4));
        }
      }
      agit += (maxDart - agit) * clamp(dt * 5, 0, 1);
      U.uAgit.value = agit;
    }
  };
})();
inhabitants.push(school);
// ---- the water surface ---------------------------------------------------
const floatOK = renderer.extensions.has('EXT_color_buffer_float');
const RT_TYPE = floatOK ? THREE.HalfFloatType : THREE.UnsignedByteType;
const refractRT = new THREE.WebGLRenderTarget(2, 2, {
  type: RT_TYPE, format: THREE.RGBAFormat,
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  depthBuffer: true, stencilBuffer: false, generateMipmaps: false,
});
U.uRefract.value = refractRT.texture;
const projView = new THREE.Matrix4();
const waterUniforms = Object.assign({}, U, {
  uProjView: { value: projView },
  uFogColor: { value: scene.fog.color },
});
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: FIELD + /* glsl */`
    varying vec3 vWPos;
    void main(){
      vec3 pos = position;
      vec4 wp0 = modelMatrix * vec4(pos, 1.0);
      vec3 sw = swell(wp0.xz, uTime);
      pos.y += uWater + sw.x;
      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: FIELD + /* glsl */`
    uniform mat4 uProjView;
    uniform sampler2D uRefract;
    uniform vec3 uCamPos, uWaterTint, uWaterDeep, uFogColor;
    varying vec3 vWPos;
    void main(){
      vec2 p = vWPos.xz;
      float depth = uWater - terrainH(p);
      if (depth < 0.006) discard;

      vec3 sw = swell(p, uTime);
      vec2 rg = rippleGrad(p);
      float rh = rippleH(p);
      vec2 slope = sw.yz + windSlope(p, uTime) + clamp(rg * 1.5, vec2(-0.55), vec2(0.55));
      vec3 N = normalize(vec3(-slope.x, 1.0, -slope.y));
      vec3 V = normalize(uCamPos - vWPos);
      float ndv = clamp(dot(N, V), 0.0, 1.0);

      // refraction: trace the bent ray down to the bed, then look it up in the
      // pre-water pass so the caustics and the creatures bend with the surface
      vec3 rd = refract(-V, N, 0.750);
      float path = min(depth / max(-rd.y, 0.18), 7.0);
      vec3 hit = vWPos + rd * path;
      vec4 clip = uProjView * vec4(hit, 1.0);
      vec2 ruv = clamp(clip.xy / clip.w * 0.5 + 0.5, 0.002, 0.998);
      vec3 refr = texture2D(uRefract, ruv).rgb;

      float murk = uTurbidity * 2.4;
      vec3 trans = exp(-vec3(0.40, 0.13, 0.09) * (depth * 1.30 + murk));
      vec3 scatter = mix(uWaterTint, uWaterDeep, smoothstep(0.45, 3.2, depth));
      vec3 col = refr * trans + scatter * (1.0 - trans) * 0.80;
      col = mix(col, scatter * 1.35 + refr * 0.18, clamp(uTurbidity * 0.55, 0.0, 0.6));
      // ripple crests focus light, troughs defocus it: the rings stay legible
      col *= 1.0 + clamp(rippleCurv(p) * 1.2, -0.35, 0.45);

      // sky at grazing angles
      vec3 R = reflect(-V, N);
      float fres = (0.030 + 0.970 * pow(1.0 - ndv, 4.0)) * 2.5;
      col = mix(col, skyColor(R), clamp(fres, 0.0, 0.60));

      // sun glitter on the ripple facets
      vec3 H = normalize(V + uSunDir);
      float nh = max(dot(N, H), 0.0);
      col += vec3(1.0, 0.91, 0.74) * (pow(nh, 110.0) * 0.50 + pow(nh, 850.0) * 2.8);

      // foam: waterline, ripple crests, the bore, and whitecaps out at sea
      float fn = texture2D(uNoise, p * 1.5 + vec2(uTime * 0.055, -uTime * 0.038)).b;
      float fn2 = texture2D(uNoise, p * 1.1 - vec2(uTime * 0.09, uTime * 0.05)).b;
      float fnLo = texture2D(uNoise, p * 0.45 + vec2(uTime * 0.020, uTime * 0.013)).b;
      float shore = (1.0 - smoothstep(0.0, 0.085, depth)) * (0.18 + 0.82 * smoothstep(0.40, 0.76, fn));
      float bore = exp(-pow((p.y - uSurgeZ) / 0.60, 2.0)) * uSurge;
      float crest = smoothstep(0.006, 0.030, rh) * (0.3 + 0.7 * fn2);
      float caps = smoothstep(1.4, 3.0, depth) * smoothstep(0.020, 0.060, sw.x) * smoothstep(0.42, 0.68, fnLo);
      float foam = clamp(shore * 0.60 + bore * (0.30 + 0.50 * smoothstep(0.34, 0.74, fnLo)) + crest * 0.30 + caps * 0.55, 0.0, 1.0);
      col = mix(col, vec3(0.90, 0.97, 0.96) * (1.05 + 0.35 * fn2), foam * 0.85);

      float fogF = smoothstep(26.0, 72.0, length(uCamPos - vWPos));
      col = mix(col, uFogColor, fogF);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const waterGeo = new THREE.PlaneGeometry(CFG.world, CFG.world, SMALL ? 110 : 150, SMALL ? 110 : 150);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, waterMat);
water.layers.set(2);
water.renderOrder = 10;
water.frustumCulled = false;
scene.add(water);
// ---- ripple field: wave equation with rock boundaries --------------------
const SIM_DT = 1 / 180, SIM_C2 = 0.42, SIM_DAMP = 0.9982;
const dropQueue = [];
function addDrop(x, z, amp, rad) {
  if (dropQueue.length > 14) dropQueue.shift();
  dropQueue.push({ x, z, amp, rad });
}
const ripples = (() => {
  const n = CFG.simRes, span = CFG.simSpan, min = -span / 2;
  if (floatOK) {
    const opts = { type: RT_TYPE, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false };
    const rt = [new THREE.WebGLRenderTarget(n, n, opts), new THREE.WebGLRenderTarget(n, n, opts)];
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uPrev: { value: null }, uMask: { value: maskTex },
        uTexel: { value: new THREE.Vector2(1 / n, 1 / n) },
        uMin: { value: new THREE.Vector2(min, min) }, uSize: { value: new THREE.Vector2(span, span) },
        uDrops: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
        uDropCount: { value: 0 }, uSurge: U.uSurge, uSurgeZ: U.uSurgeZ, uDamp: { value: SIM_DAMP },
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform sampler2D uPrev, uMask;
        uniform vec2 uTexel, uMin, uSize;
        uniform vec4 uDrops[4];
        uniform int uDropCount;
        uniform float uSurge, uSurgeZ, uDamp;
        varying vec2 vUv;
        void main(){
          vec2 uv = vUv;
          float m = texture2D(uMask, uv).r;
          vec2 s = texture2D(uPrev, uv).rg;
          float h = s.r;
          float ml = texture2D(uMask, uv - vec2(uTexel.x, 0.0)).r;
          float mr = texture2D(uMask, uv + vec2(uTexel.x, 0.0)).r;
          float md = texture2D(uMask, uv - vec2(0.0, uTexel.y)).r;
          float mu = texture2D(uMask, uv + vec2(0.0, uTexel.y)).r;
          float hl = ml > 0.5 ? h : texture2D(uPrev, uv - vec2(uTexel.x, 0.0)).r;
          float hr = mr > 0.5 ? h : texture2D(uPrev, uv + vec2(uTexel.x, 0.0)).r;
          float hd = md > 0.5 ? h : texture2D(uPrev, uv - vec2(0.0, uTexel.y)).r;
          float hu = mu > 0.5 ? h : texture2D(uPrev, uv + vec2(0.0, uTexel.y)).r;
          float nh = (2.0 * h - s.g) + ${SIM_C2.toFixed(3)} * (hl + hr + hd + hu - 4.0 * h);
          nh *= uDamp;
          vec2 edge = min(uv, 1.0 - uv);
          float openN = 1.0 - smoothstep(0.0, 0.05, uv.y);   // the sea side stays open
          float e = smoothstep(0.0, 0.055, min(edge.x, 1.0 - uv.y));
          nh *= mix(mix(0.80, 1.0, e), 0.985, openN);
          vec2 wp = uMin + uv * uSize;
          for (int i = 0; i < 4; i++){
            if (i >= uDropCount) break;
            vec4 d = uDrops[i];
            float r2 = dot(wp - d.xy, wp - d.xy);
            nh -= d.w * exp(-r2 / (d.z * d.z));
          }
          float band = exp(-pow((wp.y - uSurgeZ) / 0.42, 2.0));
          nh += band * uSurge * 0.0013 * (1.0 - step(0.5, m));
          if (m > 0.5) nh = 0.0;
          gl_FragColor = vec4(nh, h, 0.0, 1.0);
        }`,
    });
    const sc = new THREE.Scene();
    sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    renderer.setClearColor(0x000000, 0);
    for (const r of rt) { renderer.setRenderTarget(r); renderer.clear(true, false, false); }
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x0a2c37, 1);
    let cur = 0, acc = 0;
    return {
      get texture() { return rt[cur].texture; },
      step(dt) {
        acc = Math.min(acc + dt, SIM_DT * 7);
        let first = true;
        while (acc >= SIM_DT) {
          acc -= SIM_DT;
          const dst = rt[1 - cur];
          mat.uniforms.uPrev.value = rt[cur].texture;
          let cnt = 0;
          if (first) {
            while (cnt < 4 && dropQueue.length) {
              const d = dropQueue.shift();
              mat.uniforms.uDrops.value[cnt].set(d.x, d.z, d.rad, d.amp);
              cnt++;
            }
            first = false;
          }
          mat.uniforms.uDropCount.value = cnt;
          renderer.setRenderTarget(dst);
          renderer.render(sc, cam);
          cur = 1 - cur;
        }
        renderer.setRenderTarget(null);
        U.uRipple.value = rt[cur].texture;
      }
    };
  }
  // CPU fallback for devices without float render targets
  const nn = 96, h = new Float32Array(nn * nn), hp = new Float32Array(nn * nn);
  const mask = new Float32Array(nn * nn);
  for (let j = 0; j < nn; j++) for (let i = 0; i < nn; i++) {
    const x = min + (i / (nn - 1)) * span, z = min + (j / (nn - 1)) * span;
    let hh = terrainH(x, z);
    for (const b of BOULDERS) {
      const d = Math.hypot(x - b.x, z - b.z);
      if (d < b.r * 0.92) hh = Math.max(hh, boulderY(b) + Math.sqrt(Math.max(0, b.r * b.r * 0.85 - d * d)) * 0.74);
    }
    mask[j * nn + i] = hh > -0.015 ? 1 : 0;
  }
  const data = new Uint16Array(nn * nn * 4);
  const tex = new THREE.DataTexture(data, nn, nn, THREE.RGBAFormat, THREE.HalfFloatType);
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  let acc = 0;
  return {
    texture: tex,
    step(dt) {
      acc = Math.min(acc + dt, SIM_DT * 7);
      const dx = span / (nn - 1);
      while (acc >= SIM_DT) {
        acc -= SIM_DT;
        const drops = dropQueue.splice(0, 4);
        for (let j = 1; j < nn - 1; j++) for (let i = 1; i < nn - 1; i++) {
          const k = j * nn + i;
          if (mask[k] > 0.5) { h[k] = 0; continue; }
          const c = h[k];
          const hl = mask[k - 1] > 0.5 ? c : h[k - 1], hr = mask[k + 1] > 0.5 ? c : h[k + 1];
          const hd = mask[k - nn] > 0.5 ? c : h[k - nn], hu = mask[k + nn] > 0.5 ? c : h[k + nn];
          let v = ((2 * c - hp[k]) + SIM_C2 * (hl + hr + hd + hu - 4 * c)) * SIM_DAMP;
          const x = min + i * dx, z = min + j * dx;
          for (const d of drops) v -= d.amp * Math.exp(-((x - d.x) ** 2 + (z - d.z) ** 2) / (d.rad * d.rad));
          v += Math.exp(-Math.pow((z - U.uSurgeZ.value) / 0.42, 2)) * U.uSurge.value * 0.0013;
          hp[k] = c; h[k] = v;
        }
      }
      for (let k = 0; k < nn * nn; k++) {
        data[k * 4] = THREE.DataUtils.toHalfFloat(h[k]);
        data[k * 4 + 1] = THREE.DataUtils.toHalfFloat(hp[k]);
        data[k * 4 + 3] = THREE.DataUtils.toHalfFloat(1);
      }
      tex.needsUpdate = true;
      U.uRipple.value = tex;
    }
  };
})();
U.uRipple.value = ripples.texture;
// ---- touch the water -----------------------------------------------------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const touchPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint = new THREE.Vector3();
function waterHit(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  touchPlane.constant = -U.uWater.value;
  if (!raycaster.ray.intersectPlane(touchPlane, hitPoint)) return null;
  if (depthAt(hitPoint.x, hitPoint.z) < 0.035) return null;
  if (Math.abs(hitPoint.x) > CFG.simSpan / 2 - 0.3 || Math.abs(hitPoint.z) > CFG.simSpan / 2 - 0.3) return null;
  return hitPoint;
}
function splash(x, z, power, t) {
  addDrop(x, z, 0.085 * power, 0.13);
  addDrop(x, z, -0.032 * power, 0.26);
  touch.x = x; touch.z = z; touch.t = t; touch.power = power;
  for (const c of [crab, school, anemone]) c.startle(t, x, z, power);
}
const active = new Map();
let clockT = 0;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  const p = waterHit(e.clientX, e.clientY);
  active.set(e.pointerId, { last: -1, x: 0, z: 0 });
  if (!p) return;
  splash(p.x, p.z, 1.0, clockT);
  active.get(e.pointerId).last = clockT;
  active.get(e.pointerId).x = p.x; active.get(e.pointerId).z = p.z;
}, { passive: true });
canvas.addEventListener('pointermove', (e) => {
  const st = active.get(e.pointerId);
  if (!st) return;
  const p = waterHit(e.clientX, e.clientY);
  if (!p) return;
  const moved = Math.hypot(p.x - st.x, p.z - st.z);
  if (clockT - st.last > 0.042 && moved > 0.035) {
    addDrop(p.x, p.z, 0.024, 0.075);
    st.last = clockT; st.x = p.x; st.z = p.z;
    touch.x = p.x; touch.z = p.z; touch.t = clockT; touch.power = 0.45;
    school.startle(clockT, p.x, p.z, 0.45);
    if (Math.hypot(anemone.x - p.x, anemone.z - p.z) < 0.8) anemone.startle(clockT, p.x, p.z, 0.5);
    if (Math.random() < 0.25) crab.startle(clockT, p.x, p.z, 0.5);
  }
}, { passive: true });
const endPointer = (e) => { active.delete(e.pointerId); };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- resize --------------------------------------------------------------
const dbSize = new THREE.Vector2();
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  frameCamera();
  renderer.getDrawingBufferSize(dbSize);
  const s = SMALL ? 0.85 : 0.9;
  refractRT.setSize(Math.max(2, Math.round(dbSize.x * s)), Math.max(2, Math.round(dbSize.y * s)));
  motes.material.uniforms.uPR.value = renderer.getPixelRatio();
}
addEventListener('resize', resize, { passive: true });
addEventListener('orientationchange', () => setTimeout(resize, 250), { passive: true });
resize();
// ---- surge from the open sea --------------------------------------------
const SURGE_DUR = 7.0;
let nextSurge = 5.5 + Math.random() * 4, surgeT = -1, surgeStir = 0;
function updateSurge(t, dt) {
  if (surgeT < 0 && t > nextSurge) { surgeT = 0; }
  if (surgeT >= 0) {
    surgeT += dt;
    const u = surgeT / SURGE_DUR;
    if (u >= 1) {
      surgeT = -1; nextSurge = t + 12 + Math.random() * 11;
      U.uSurge.value = 0; U.uSurgeZ.value = -9;
    } else {
      const env = Math.sin(Math.PI * Math.pow(u, 0.62));
      U.uSurge.value = env;
      const f = clamp((u - 0.05) / 0.58, 0, 1);
      U.uSurgeZ.value = lerp(-7.5, 2.2, f * f * (3 - 2 * f));
      U.uWater.value = CFG.waterY + env * 0.085;
      U.uTurbidity.value = Math.max(U.uTurbidity.value, env * 0.5);
      const fz = U.uSurgeZ.value;
      if (f > 0 && f < 1) {
        school.startle(t, 0, fz, 0.55 * env);
        crab.startle(t, crab.group.position.x, fz, 0.6 * env);
        anemone.startle(t, anemone.x, fz, 0.7 * env);
        surgeStir -= dt;
        if (surgeStir <= 0) {
          surgeStir = 0.09;
          const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 2.9;
          addDrop(Math.cos(a) * r, clamp(fz + (Math.random() - 0.5) * 0.9, -5, 3), 0.009 * env, 0.16);
        }
      }
    }
  } else {
    U.uSurge.value *= Math.pow(0.015, dt);
    U.uWater.value += (CFG.waterY - U.uWater.value) * clamp(dt * 1.4, 0, 1);
    U.uTurbidity.value *= Math.pow(0.76, dt);
  }
}

// ---- frame loop ----------------------------------------------------------
sun.shadow.camera.updateProjectionMatrix();
renderer.shadowMap.needsUpdate = true;

let prev = performance.now() / 1000, frames = 0, slow = 0, quality = 0;
let idleRipple = 3 + Math.random() * 3;
const lookTarget = new THREE.Vector3();

function tick() {
  const now = performance.now() / 1000;
  let dt = now - prev; prev = now;
  if (document.hidden) return;
  dt = clamp(dt, 0.0005, 0.05);
  clockT += dt;
  const t = clockT;
  U.uTime.value = t;

  updateSurge(t, dt);

  idleRipple -= dt;
  if (idleRipple <= 0) {
    idleRipple = 3.5 + Math.random() * 4.5;
    const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 2.8;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (depthAt(x, z) > 0.15) addDrop(x, z, 0.012, 0.085);
  }

  for (const c of inhabitants) c.update(t, dt);
  ripples.step(dt);

  // slow breathing camera
  camera.position.set(
    camBase.x + Math.sin(t * 0.11) * 0.085 + Math.sin(t * 0.043) * 0.05,
    camBase.y + Math.sin(t * 0.077 + 1.3) * 0.045,
    camBase.z + Math.cos(t * 0.09) * 0.07
  );
  lookTarget.set(CAM_TARGET.x + Math.sin(t * 0.05) * 0.045, CAM_TARGET.y, CAM_TARGET.z + Math.cos(t * 0.061) * 0.045);
  camera.lookAt(lookTarget);
  camera.updateMatrixWorld();
  projView.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  U.uCamPos.value.copy(camera.position);

  rtCamera.position.copy(camera.position);
  rtCamera.quaternion.copy(camera.quaternion);
  rtCamera.fov = camera.fov; rtCamera.aspect = camera.aspect;
  rtCamera.near = camera.near; rtCamera.far = camera.far;
  rtCamera.updateProjectionMatrix();
  rtCamera.updateMatrixWorld();

  renderer.setRenderTarget(refractRT);
  renderer.render(scene, rtCamera);
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);

  if (++frames === 2) {
    canvas.classList.add('live');
    document.getElementById('atmos').classList.add('live');
    document.getElementById('grain').classList.add('live');
  }
  // one-way quality safety net on weak GPUs
  if (frames > 90 && quality < 2) {
    slow = dt > 0.026 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 100) {
      quality++; slow = 0;
      renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() - 0.35));
      resize();
    }
  }
}
renderer.setAnimationLoop(tick);
document.addEventListener('visibilitychange', () => { prev = performance.now() / 1000; });
</script>
